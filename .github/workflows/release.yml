name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Create stub figure files for tests
        run: |
          mkdir -p output/manuscript/figures
          mkdir -p figures/manuscript
          mkdir -p figures/voting
          mkdir -p figures/three_way
          mkdir -p figures/speeches

          python3 -c "
          import base64
          png_data = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')

          figures = [
              'output/manuscript/figures/figure_consistency_vs_fulfillment.png',
              'output/manuscript/figures/figure_parliament_direction_over_time.png',
              'output/manuscript/figures/figure_consistency_fulfillment_vs_benchmark_party_year.png',
              'output/manuscript/figures/figure_modality_overlay_by_party.png',
              'figures/manuscript/pie_chart_categories.png',
              'figures/manuscript/party_motions_stacked.png',
              'figures/voting/party_cohesion_timeseries.png',
              'figures/three_way/divergence_speech_vs_combined_significance.png',
              'figures/speeches/speech_profiles_heatmap.png',
          ]

          for fig in figures:
              with open(fig, 'wb') as f:
                  f.write(png_data)
              print(f'Created stub: {fig}')
          "

      - name: Run tests
        run: pytest -q

  release:
    name: Package and publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source archive
        run: |
          TAG=${GITHUB_REF_NAME}
          # Exclude generated / venv artifacts from the archive
          git archive --format=zip --prefix="policy-classifier-${TAG}/" \
            -o "policy-classifier-${TAG}.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "policy-classifier ${{ github.ref_name }}"
          body: |
            ## policy-classifier ${{ github.ref_name }}

            ### Install
            ```bash
            pip install -r requirements.txt
            ```

            ### What's included
            Source archive built from the `${{ github.ref_name }}` tag.
            See [README.md](https://github.com/yidaki53/policy-classifier#readme) for full usage instructions.
          files: "policy-classifier-${{ github.ref_name }}.zip"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
